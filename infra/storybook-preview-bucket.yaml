AWSTemplateFormatVersion: '2010-09-09'
Description: Public S3 website bucket for Storybook PR previews.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique S3 bucket name.

Resources:
  PreviewBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html

  PreviewBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PreviewBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicRead
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${PreviewBucket.Arn}/*'

  DeployPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: GitHub Actions can upload the docs site and Storybook previews.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
            Resource: !GetAtt PreviewBucket.Arn
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
            Resource: !Sub '${PreviewBucket.Arn}/*'
          - Effect: Allow
            Action:
              - cloudfront:ListDistributions
            Resource: '*'
          - Effect: Allow
            Action:
              - cloudfront:CreateInvalidation
            Resource: arn:aws:cloudfront::915376883059:distribution/*

Outputs:
  BucketName:
    Value: !Ref PreviewBucket
  WebsiteURL:
    Value: !GetAtt PreviewBucket.WebsiteURL
  DeployPolicyArn:
    Value: !Ref DeployPolicy
