name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  builds:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter k-web-ui-docs build
      - run: pnpm --filter k-web-ui-dev-env build
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: dev-env/storybook-static
          if-no-files-found: error
          retention-days: 14

  deploy-storybook:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [builds]
    runs-on: ubuntu-latest
    concurrency:
      group: storybook-pr-${{ github.event.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      deployments: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STORYBOOK_S3_BUCKET: ${{ vars.STORYBOOK_S3_BUCKET }}
      PREVIEW_URL: ${{ vars.STORYBOOK_PREVIEW_BASE_URL || format('http://{0}.s3-website-{1}.amazonaws.com', vars.STORYBOOK_S3_BUCKET, vars.AWS_REGION) }}/pr/${{ github.event.number }}/
    environment:
      name: storybook-pr-${{ github.event.number }}
      url: ${{ vars.STORYBOOK_PREVIEW_BASE_URL || format('http://{0}.s3-website-{1}.amazonaws.com', vars.STORYBOOK_S3_BUCKET, vars.AWS_REGION) }}/pr/${{ github.event.number }}/
    steps:
      - name: Check AWS settings
        run: |
          missing=
          [ -n "$STORYBOOK_S3_BUCKET" ] || missing="$missing STORYBOOK_S3_BUCKET"
          [ -n "$AWS_REGION" ] || missing="$missing AWS_REGION"
          if [ -n "$missing" ]; then
            echo "Set these GitHub repository variables:$missing"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: preview
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload Storybook preview
        run: aws s3 sync preview "s3://${STORYBOOK_S3_BUCKET}/pr/${{ github.event.number }}/" --delete
      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const marker = '<!-- storybook-preview -->';
            const url = process.env.PREVIEW_URL;
            const body = [
              marker,
              `**Storybook preview:** ${url}`,
              '',
              `When you are done looking, shut it down from Actions → **Tear down Storybook** with PR number \`${pr}\`.`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [builds]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish if the version is new
        run: |
          current="$(node -p "require('./package/package.json').version")"
          published="$(npm view k-web-ui version 2>/dev/null || true)"
          if [ "$published" = "$current" ]; then
            echo "k-web-ui@$current is already on npm"
            exit 0
          fi
          pnpm --filter k-web-ui publish --access public --no-git-checks
