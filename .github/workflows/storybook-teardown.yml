name: Tear down Storybook
run-name: Tear down Storybook PR ${{ github.event.inputs.pr_number || github.event.pull_request.number }}

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose Storybook preview should be shut down
        required: true
        type: string
  pull_request:
    types: [closed]

concurrency:
  group: storybook-pr-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  teardown:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      deployments: write
    environment:
      name: storybook-pr-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
    env:
      AWS_REGION: us-east-2
      STORYBOOK_S3_BUCKET: storybook-915376883059-us-east-2-an
      CLOUDFRONT_DISTRIBUTION_ID: E15HY49OQ7IVP4
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::915376883059:role/GitHubStorybookDeploy
          aws-region: ${{ env.AWS_REGION }}
      - name: Remove the preview files
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "PR number must be digits, got: $PR_NUMBER"
            exit 1
          fi
          prefix="s3://${STORYBOOK_S3_BUCKET}/pr/${PR_NUMBER}/"
          if [ -z "$(aws s3 ls "$prefix")" ]; then
            echo "No Storybook preview at $prefix"
          else
            aws s3 rm "$prefix" --recursive
          fi
      - name: Drop the CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/pr/${PR_NUMBER}/*" "/pr/${PR_NUMBER}/index.html"
      - name: Mark the GitHub deployment inactive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?environment=storybook-pr-${PR_NUMBER}" --jq '.[].id')"
          if [ -z "$ids" ]; then
            echo "No GitHub deployments recorded for storybook-pr-${PR_NUMBER}"
            exit 0
          fi
          for id in $ids; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
              -f state=inactive \
              -f environment="storybook-pr-${PR_NUMBER}" \
              -f description="Storybook preview shut down"
          done
